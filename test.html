
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10-Min Audio Match</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 12px;
      background: #111827;
      color: #f9fafb;
    }

    .card {
      background: #1f2937;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
    }

    .timer {
      font-size: 3.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 18px 0;
      color: #10b981;
    }

    .timer.warning { color: #ef4444; }

    .status {
      color: #9ca3af;
      margin-bottom: 20px;
      min-height: 42px;
      font-size: .95rem;
      line-height: 1.5;
    }

    button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #startBtn { background: #3b82f6; color: white; }
    #muteBtn { background: #4b5563; color: white; display: none; }
    #muteBtn.muted { background: #f59e0b; color: #111827; }
    #stopBtn { background: #ef4444; color: white; display: none; }
    #enableAudioBtn { background: #10b981; color: #052e24; display: none; }

    #remoteAudio {
      width: 100%;
      margin-top: 12px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background: #374151;
      color: white;
      border: none;
      margin-bottom: 10px;
    }

    .small {
      font-size: .82rem;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>10-Min Audio Match</h2>

    <div id="status" class="status">
      Click below to find a random voice partner.
    </div>

    <div id="timer" class="timer">10:00</div>

    <button id="startBtn">Find Partner</button>
    <button id="muteBtn">Mute Mic</button>
    <button id="enableAudioBtn">Enable Remote Audio</button>
    <button id="stopBtn">End Call</button>

    <audio id="remoteAudio" autoplay playsinline controls></audio>

    <p class="small">
      Your microphone is used only during your voice session.
    </p>
  </div>

  <div class="card" style="margin-top:20px;">
    <h3 style="color:#10b981;">GitHub Audio Library</h3>

    <p class="small">
      Choose a track to listen to on this page.
    </p>

    <select id="audioSelect">
      <option value="">-- Choose an audio track --</option>
      <option value="audios/jamil.mp3">Track 1</option>
      <option value="audios/j1.mp3">Track 2</option>
    </select>

    <audio id="libraryAudio" controls style="width:100%;"></audio>
  </div>

<script>
"use strict";

// Keep your existing deployed Apps Script URL.
const API_URL =
  "https://script.google.com/macros/s/AKfycbx6V1XLJFYh9XjcFW9uJoc4BysZtmddm2xYQUGmro_90sk6JDMFAozynBHesOFJHLi2GA/exec";

const $ = id => document.getElementById(id);

const App = {
  peer: null,
  peerId: null,
  localStream: null,
  currentCall: null,

  pollInterval: null,
  connectionTimeout: null,
  timerInterval: null,

  secondsLeft: 600,
  isMuted: false,
  isSearching: false,
  matchHandled: false,
  stopping: false,
  pollBusy: false,
  sessionStarted: false,

  // -----------------------------
  // Interface
  // -----------------------------

  status(message) {
    $("status").textContent = message;
  },

  show(id, visible) {
    $(id).style.display = visible ? "block" : "none";
  },

  // -----------------------------
  // Start
  // -----------------------------

  async start() {
    if (this.isSearching) return;

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      this.status("Microphone access requires HTTPS.");
      return;
    }

    this.stopping = false;
    this.isSearching = true;
    this.matchHandled = false;
    this.sessionStarted = false;

    $("startBtn").disabled = true;
    this.status("Requesting microphone permission...");

    try {
      this.localStream =
        await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
    } catch (err) {
      this.status(
        "Microphone error: " + err.name +
        ". Please allow microphone access."
      );
      this.resetInterface();
      return;
    }

    this.status("Connecting to the voice network...");

    this.peer = new Peer({
      debug: 1,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" }
        ]
      }
    });

    this.peer.on("open", id => {
      if (this.stopping) return;

      this.peerId = id;
      this.status("Searching for a voice partner...");
      this.poll();
      this.pollInterval = setInterval(() => this.poll(), 2500);
    });

    this.peer.on("call", incomingCall => {
      if (this.stopping || !this.isSearching ||
          !this.localStream || this.currentCall) {
        incomingCall.close();
        return;
      }

      this.matchHandled = true;
      clearInterval(this.pollInterval);

      this.status("Partner is calling. Answering...");
      incomingCall.answer(this.localStream);
      this.bindCall(incomingCall);
    });

    this.peer.on("error", err => {
      console.error("PeerJS error:", err);

      if (this.stopping) return;

      this.status("Voice network error: " + err.type);
    });

    this.peer.on("disconnected", () => {
      console.warn("PeerJS signaling server disconnected.");
      if (!this.stopping) {
        this.status("Voice signaling disconnected. Existing call may continue.");
      }
    });
  },

  // -----------------------------
  // Matchmaking
  // -----------------------------

  async poll() {
    if (!this.peerId || this.pollBusy ||
        this.stopping || this.matchHandled) return;

    this.pollBusy = true;

    try {
      const url =
        API_URL +
        "?action=find&peerId=" +
        encodeURIComponent(this.peerId) +
        "&t=" + Date.now();

      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Matchmaking server returned " + response.status);
      }

      const data = await response.json();

      if (data.status === "matched") {
        this.matchHandled = true;
        clearInterval(this.pollInterval);

        this.status("Partner found! Establishing voice connection...");

        // Only one peer initiates the call.
        if (data.initiator) {
          this.makeCall(data.targetPeerId);
        } else {
          this.status("Partner found! Waiting for their call...");
        }

      } else if (data.status === "error") {
        throw new Error(data.message || "Matchmaking error");
      }

    } catch (err) {
      console.error("Matchmaking error:", err);
      this.status("Matchmaking connection problem. Retrying...");
    } finally {
      this.pollBusy = false;
    }
  },

  // -----------------------------
  // Outgoing call
  // -----------------------------

  makeCall(targetPeerId) {
    if (!this.peer || !this.localStream || this.stopping) return;

    try {
      const call = this.peer.call(targetPeerId, this.localStream);

      if (!call) {
        this.stop("Could not create the voice call. Please try again.");
        return;
      }

      this.bindCall(call);

    } catch (err) {
      console.error("Call error:", err);
      this.stop("Unable to call your partner.");
    }
  },

  // -----------------------------
  // Call and remote audio
  // -----------------------------

  bindCall(call) {
    if (this.stopping) {
      call.close();
      return;
    }

    if (this.currentCall && this.currentCall !== call) {
      call.close();
      return;
    }

    this.currentCall = call;

    this.connectionTimeout = setTimeout(() => {
      if (!this.sessionStarted && !this.stopping) {
        this.stop(
          "Connection timed out. This network pair may require TURN."
        );
      }
    }, 30000);

    // Monitor the underlying WebRTC connection.
    const monitorConnection = () => {
      const pc = call.peerConnection;
      if (!pc) return;

      const reportState = () => {
        console.log("ICE state:", pc.iceConnectionState);
        console.log("Peer connection:", pc.connectionState);
      };

      pc.addEventListener("iceconnectionstatechange", reportState);
      pc.addEventListener("connectionstatechange", reportState);
    };

    monitorConnection();

    call.on("stream", remoteStream => {
      if (this.stopping) return;

      clearTimeout(this.connectionTimeout);

      const audio = $("remoteAudio");
      audio.srcObject = remoteStream;
      audio.muted = false;
      audio.volume = 1;

      const tracks = remoteStream.getAudioTracks();

      console.log("Remote audio tracks:", tracks);

      tracks.forEach(track => {
        console.log(
          "Remote track:",
          track.readyState,
          "enabled:", track.enabled,
          "muted:", track.muted
        );

        track.onunmute = () => {
          console.log("Remote audio track is unmuted.");
        };

        track.onmute = () => {
          console.warn("Remote audio track is muted.");
        };
      });

      this.status("Audio stream received. Starting your 10-minute session...");

      this.show("muteBtn", true);
      this.show("enableAudioBtn", true);

      // Firefox may block autoplay. Give the user a manual playback button.
      const playResult = audio.play();

      if (playResult && typeof playResult.then === "function") {
        playResult.then(() => {
          this.status("Audio connected. You have 10 minutes!");
        }).catch(err => {
          console.warn("Audio autoplay blocked:", err);

          this.status(
            "Voice stream received. Click Enable Remote Audio to hear your partner."
          );
        });
      }

      if (!this.sessionStarted) {
        this.sessionStarted = true;
        this.startTimer();
      }
    });

    call.on("close", () => {
      if (!this.stopping) {
        this.stop("Your partner disconnected.");
      }
    });

    call.on("error", err => {
      console.error("Call error:", err);

      if (!this.stopping) {
        this.stop("Voice call failed: " + err.message);
      }
    });
  },

  async enableAudio() {
    const audio = $("remoteAudio");

    if (!audio.srcObject) {
      this.status("No remote audio stream has arrived yet.");
      return;
    }

    audio.muted = false;
    audio.volume = 1;

    try {
      await audio.play();
      this.status("Remote audio playback enabled.");
      this.show("enableAudioBtn", false);
    } catch (err) {
      console.error("Manual playback failed:", err);
      this.status("Firefox could not play the audio. Check site sound permissions.");
    }
  },

  // -----------------------------
  // Microphone mute
  // -----------------------------

  toggleMute() {
    if (!this.localStream) return;

    this.isMuted = !this.isMuted;

    this.localStream.getAudioTracks().forEach(track => {
      track.enabled = !this.isMuted;
    });

    const button = $("muteBtn");

    button.textContent = this.isMuted ? "Unmute Mic" : "Mute Mic";
    button.classList.toggle("muted", this.isMuted);
  },

  // -----------------------------
  // 10-minute timer
  // -----------------------------

  startTimer() {
    this.stopTimer();

    this.secondsLeft = 600;
    this.renderTimer();

    this.timerInterval = setInterval(() => {
      this.secondsLeft--;
      this.renderTimer();

      if (this.secondsLeft <= 0) {
        this.stop("Time is up! Your 10-minute session is complete.");
      }
    }, 1000);
  },

  stopTimer() {
    clearInterval(this.timerInterval);
    this.timerInterval = null;
  },

  renderTimer() {
    const mins = String(
      Math.floor(this.secondsLeft / 60)
    ).padStart(2, "0");

    const secs = String(
      this.secondsLeft % 60
    ).padStart(2, "0");

    $("timer").textContent = mins + ":" + secs;

    $("timer").classList.toggle(
      "warning",
      this.secondsLeft <= 30 && this.secondsLeft > 0
    );
  },

  // -----------------------------
  // Stop and cleanup
  // -----------------------------

  async stop(reason) {
    if (this.stopping) return;
    this.stopping = true;

    clearInterval(this.pollInterval);
    this.pollInterval = null;

    clearTimeout(this.connectionTimeout);
    this.connectionTimeout = null;

    this.stopTimer();

    const oldPeerId = this.peerId;

    // Leave the matchmaking queue and remove the stored pair.
    if (oldPeerId) {
      fetch(
        API_URL +
        "?action=leave&peerId=" +
        encodeURIComponent(oldPeerId),
        { cache: "no-store", keepalive: true }
      ).catch(err => console.warn("Leave request failed:", err));
    }

    if (this.currentCall) {
      const oldCall = this.currentCall;
      this.currentCall = null;
      oldCall.close();
    }

    if (this.peer) {
      const oldPeer = this.peer;
      this.peer = null;
      oldPeer.destroy();
    }

    if (this.localStream) {
      this.localStream.getTracks().forEach(track => track.stop());
      this.localStream = null;
    }

    $("remoteAudio").pause();
    $("remoteAudio").srcObject = null;

    this.peerId = null;
    this.isMuted = false;
    this.isSearching = false;
    this.matchHandled = false;
    this.sessionStarted = false;
    this.pollBusy = false;

    this.status(reason);
    this.resetInterface();
  },

  resetInterface() {
    this.stopTimer();
    clearInterval(this.pollInterval);
    clearTimeout(this.connectionTimeout);

    this.show("startBtn", true);
    this.show("muteBtn", false);
    this.show("stopBtn", false);
    this.show("enableAudioBtn", false);

    $("startBtn").disabled = false;
    $("muteBtn").textContent = "Mute Mic";
    $("muteBtn").classList.remove("muted");

    this.secondsLeft = 600;
    this.renderTimer();
  }
};

// -----------------------------
// Buttons
// -----------------------------

$("startBtn").addEventListener("click", () => {
  $("startBtn").style.display = "none";
  $("stopBtn").style.display = "block";
  App.start();
});

$("muteBtn").addEventListener("click", () => App.toggleMute());

$("enableAudioBtn").addEventListener("click", () => {
  App.enableAudio();
});

$("stopBtn").addEventListener("click", () => {
  App.stop("Session ended.");
});

// -----------------------------
// Audio library
// -----------------------------

$("audioSelect").addEventListener("change", () => {
  const player = $("libraryAudio");
  const url = $("audioSelect").value;

  if (!url) return;

  player.src = url;
  player.load();
  player.play().catch(err => {
    console.warn("Library playback:", err);
  });
});

// Clean up if the user closes the page.
window.addEventListener("beforeunload", () => {
  if (App.peerId) {
    const url =
      API_URL +
      "?action=leave&peerId=" +
      encodeURIComponent(App.peerId);

    // Best-effort cleanup. The server also expires stale queue entries.
    fetch(url, { keepalive: true }).catch(() => {});
  }

  if (App.peer) App.peer.destroy();

  if (App.localStream) {
    App.localStream.getTracks().forEach(track => track.stop());
  }
});
</script>

</body>
</html>
