<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-Min P2P Voice & Audio Lounge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .dashboard {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    p.subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #0f172a;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.searching { background: #f59e0b; animation: pulse 1.2s infinite; }
    .dot.connected { background: var(--success); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      margin: 1rem 0 1.5rem;
      letter-spacing: -0.02em;
    }

    .controls { display: flex; gap: 0.75rem; }
    button {
      flex: 1;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary.muted { background: #b45309; color: white; }

    select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    audio { width: 100%; height: 40px; border-radius: 8px; }
  </style>
</head>
<body>

  <main class="dashboard">
    <!-- Feature 1: 10-Minute P2P Voice Matchmaker -->
    <section class="card">
      <h1>10-Minute Voice Match</h1>
      <p class="subtitle">Direct browser-to-browser encrypted audio. Auto-disconnects at 10:00.</p>

      <div class="status-badge">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Idle — Ready to match</span>
      </div>

      <div id="timer" class="timer-display">10:00</div>

      <div class="controls">
        <button id="findBtn" class="btn-primary">Find Partner</button>
        <button id="muteBtn" class="btn-secondary" disabled>Mute Mic</button>
        <button id="hangupBtn" class="btn-danger" disabled>End</button>
      </div>

      <!-- Hidden audio element for remote peer voice -->
      <audio id="remoteAudio" autoplay playsinline></audio>
    </section>

    <!-- Feature 2: Embedded Audio Library -->
    <section class="card">
      <h2>Audio Library</h2>
      <select id="trackSelect">
        <option value="">-- Select a background track --</option>
      </select>
      <audio id="libraryPlayer" controls preload="metadata"></audio>
    </section>
  </main>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzu4MRyemWHlv8ZVjW_gigzfCM-uh8imSb5deeq-Za0MH5-2TnsrVJiUAY07z7gARsn/exec";
    const SESSION_DURATION_SEC = 600; // 10 Minutes

    // STUN / TURN Server configuration for NAT traversal
    const RTC_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
        // Add your free TURN credentials here if experiencing strict corporate/mobile symmetric NAT blocks:
        // { urls: 'turn:YOUR_TURN_SERVER', username: '...', credential: '...' }
      ]
    };

    const AUDIO_TRACKS = [
      { title: "track1", file: "./audios/j1.mp3" },
      { title: "track2", file: "./audios/jamil.mp3" }
    ];

    // ==========================================
    // STATE VARIABLES
    // ==========================================
    let myPeerId = 'user_' + Math.random().toString(36).substring(2, 11);
    let partnerId = null;
    let localStream = null;
    let peerConnection = null;
    let pollInterval = null;
    let signalPollInterval = null;
    let countdownInterval = null;
    let secondsRemaining = SESSION_DURATION_SEC;
    let isMuted = false;

    // ==========================================
    // DOM ELEMENTS
    // ==========================================
    const findBtn = document.getElementById("findBtn");
    const muteBtn = document.getElementById("muteBtn");
    const hangupBtn = document.getElementById("hangupBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const timerEl = document.getElementById("timer");
    const remoteAudio = document.getElementById("remoteAudio");
    const trackSelect = document.getElementById("trackSelect");
    const libraryPlayer = document.getElementById("libraryPlayer");

    // ==========================================
    // AUDIO LIBRARY SETUP
    // ==========================================
    AUDIO_TRACKS.forEach(track => {
      const opt = document.createElement("option");
      opt.value = track.file;
      opt.textContent = track.title;
      trackSelect.appendChild(opt);
    });

    trackSelect.addEventListener("change", (e) => {
      if (e.target.value) {
        libraryPlayer.src = e.target.value;
        libraryPlayer.play().catch(() => {});
      } else {
        libraryPlayer.pause();
        libraryPlayer.removeAttribute("src");
      }
    });

    // ==========================================
    // MATCHMAKING & NATIVE WebRTC LOGIC
    // ==========================================
    function setStatus(state, text) {
      statusDot.className = "dot " + state;
      statusText.textContent = text;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function startCountdown() {
      clearInterval(countdownInterval);
      secondsRemaining = SESSION_DURATION_SEC;
      timerEl.textContent = formatTime(secondsRemaining);

      countdownInterval = setInterval(() => {
        secondsRemaining--;
        timerEl.textContent = formatTime(secondsRemaining);

        if (secondsRemaining <= 0) {
          endSession("10-minute session completed.");
        }
      }, 1000);
    }

    async function startMatchmaking() {
      try {
        findBtn.disabled = true;
        setStatus("searching", "Requesting microphone...");

        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        setStatus("searching", "Searching for partner...");
        hangupBtn.disabled = false;
        pollQueue();

      } catch (err) {
        console.error(err);
        setStatus("", "Microphone permission denied.");
        findBtn.disabled = false;
      }
    }

    function pollQueue() {
      const check = async () => {
        try {
          const url = `${GAS_ENDPOINT}?action=find&peerId=${encodeURIComponent(myPeerId)}`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.status === "matched") {
            clearInterval(pollInterval);
            partnerId = data.partnerId;
            setStatus("searching", "Partner found! Connecting...");

            setupPeerConnection();

            if (data.role === 'callee') {
              // Wait for signals from the caller
              startSignalPolling();
            } else {
              // I am the caller (initiator): create WebRTC Offer
              startSignalPolling();
              createAndSendOffer();
            }
          }
        } catch (err) {
          console.warn("Queue polling error, retrying...", err);
        }
      };

      check();
      pollInterval = setInterval(check, 2500);
    }

    function setupPeerConnection() {
      peerConnection = new RTCPeerConnection(RTC_CONFIG);

      // Add local microphone tracks to connection
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Receive remote audio stream from peer
      peerConnection.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0];
        setStatus("connected", "Connected — Live P2P Audio");
        muteBtn.disabled = false;
        hangupBtn.disabled = false;
        startCountdown();
      };

      // Collect ICE candidates and send them to partner via Apps Script
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({ type: 'ice', candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          endSession("Partner disconnected.");
        }
      };
    }

    async function createAndSendOffer() {
      try {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendSignal({ type: 'offer', sdp: peerConnection.localDescription });
      } catch (err) {
        console.error("Error creating offer:", err);
      }
    }

    function sendSignal(payload) {
      fetch(GAS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'send_signal',
          peerId: myPeerId,
          targetId: partnerId,
          payload: payload
        })
      }).catch(err => console.warn("Signal send failed", err));
    }

    function startSignalPolling() {
      clearInterval(signalPollInterval);
      signalPollInterval = setInterval(async () => {
        try {
          const res = await fetch(`${GAS_ENDPOINT}?action=poll_signals&peerId=${encodeURIComponent(myPeerId)}`);
          const data = await res.json();

          if (data.status === "success" && data.messages) {
            for (const msg of data.messages) {
              const payload = JSON.parse(msg.payload);
              handleIncomingSignal(payload);
            }
          }
        } catch (err) {
          console.warn("Signal poll error", err);
        }
      }, 1500);
    }

    async function handleIncomingSignal(payload) {
      if (!peerConnection) return;

      try {
        if (payload.type === 'offer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          sendSignal({ type: 'answer', sdp: peerConnection.localDescription });
        } else if (payload.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        } else if (payload.type === 'ice') {
          await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
        }
      } catch (err) {
        console.error("Error handling signal:", err);
      }
    }

    function endSession(reason = "Session ended.") {
      clearInterval(pollInterval);
      clearInterval(signalPollInterval);
      clearInterval(countdownInterval);

      if (!partnerId) {
        // Cancel waiting in queue if we haven't matched yet
        fetch(`${GAS_ENDPOINT}?action=cancel&peerId=${encodeURIComponent(myPeerId)}`).catch(() => {});
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      partnerId = null;
      remoteAudio.srcObject = null;
      isMuted = false;
      muteBtn.textContent = "Mute Mic";
      muteBtn.classList.remove("muted");
      muteBtn.disabled = true;
      hangupBtn.disabled = true;
      findBtn.disabled = false;
      timerEl.textContent = formatTime(SESSION_DURATION_SEC);
      setStatus("", reason);
    }

    // ==========================================
    // BUTTON LISTENERS
    // ==========================================
    findBtn.addEventListener("click", startMatchmaking);

    muteBtn.addEventListener("click", () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      muteBtn.textContent = isMuted ? "Unmute Mic" : "Mute Mic";
      muteBtn.classList.toggle("muted", isMuted);
    });

    hangupBtn.addEventListener("click", () => endSession("You ended the call."));

    // Clean up queue if user closes tab while searching
    window.addEventListener("beforeunload", () => {
      if (!partnerId) {
        navigator.sendBeacon(`${GAS_ENDPOINT}?action=cancel&peerId=${encodeURIComponent(myPeerId)}`);
      }
    });
  </script>
</body>
</html>
